name: CI

on:
  push:
  pull_request:
  schedule:
    # Four runs a day (00:00, 06:00, 12:00, 18:00 Central), offset per project.
    - cron: '2 0,6,12,18 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm test
